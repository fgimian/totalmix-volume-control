name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        architecture: [x64, arm64]
        type: [SelfContained, NoRuntime]

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FreSH
        uses: S42yt/FreSH@master
        with:
          version: pre

      - name: Run unit tests and produce a coverage report
        run: just report
        env:
          CONFIGURATION: ${{ matrix.configuration }}

      - name: Publish a self-contained version of the app and create the installer
        run: just installer
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          ARCHITECTURE: ${{ matrix.architecture }}
          TYPE: ${{ matrix.type }}

      - name: Upload coverage
        if: ${{ matrix.configuration == 'Release' }}
        uses: codecov/codecov-action@v5
        with:
          directory: ./.coverage
          files: Cobertura.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TotalMixVC ${{ matrix.configuration }} ${{ matrix.architecture }} ${{ matrix.type }} Setup
          path: artifacts/*.exe
          if-no-files-found: error
